<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mülakat Yönetim Paneli</title>
  <meta name="theme-color" content="#0b0d11">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="/">
        <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="url(#brandGrad)"/>
          <circle cx="24" cy="24" r="13" fill="none" stroke="#fff" stroke-width="3"/>
          <circle cx="24" cy="24" r="3.6" fill="#fff"/>
          <path d="M11.5 22.5h9M27.5 22.5h9M24 27.6V37" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#ef2b35"/><stop offset="1" stop-color="#a50c14"/></linearGradient></defs>
        </svg>
        <span class="brand__text">
          <span class="brand__name" id="clubName">Otomotiv Kulübü</span>
          <span class="brand__tag">Mülakat Yönetim Paneli</span>
        </span>
      </a>
    </div>
  </header>

  <main class="container admin-main">
    <section class="panel login-card" id="loginView" aria-labelledby="loginTitle">
      <h1 class="panel__title" id="loginTitle">Yönetici girişi</h1>
      <p class="panel__sub">Randevuları görmek için yönetici şifresini girin.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="field__error" id="loginError"></p>
        </div>
        <button class="button" type="submit"><span class="button__label">Giriş yap</span></button>
      </form>
    </section>

    <section id="dashboard" hidden aria-labelledby="dashTitle">
      <div class="toolbar">
        <div>
          <h1 class="panel__title" id="dashTitle">Mülakat randevuları</h1>
          <p class="panel__sub" id="dashSub"></p>
        </div>
        <div class="toolbar__actions">
          <button class="button button--ghost" type="button" id="refreshButton">Yenile</button>
          <button class="button button--ghost" type="button" id="csvButton">Excel / CSV indir</button>
          <button class="button button--ghost" type="button" id="logoutButton">Çıkış</button>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat"><p class="stat__label">Toplam kontenjan</p><p class="stat__value" id="statTotal">–</p></div>
        <div class="stat"><p class="stat__label">Alınan randevu</p><p class="stat__value" id="statBooked">–</p></div>
        <div class="stat"><p class="stat__label">Boş yer</p><p class="stat__value" id="statFree">–</p></div>
        <div class="stat"><p class="stat__label">Doluluk</p><p class="stat__value" id="statFill">–</p></div>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Saat</th>
                <th scope="col">Durum</th>
                <th scope="col">Ad Soyad</th>
                <th scope="col">E-posta</th>
                <th scope="col">Telefon</th>
                <th scope="col">Bölüm / Sınıf</th>
                <th scope="col">Kayıt</th>
                <th scope="col"><span class="visually-hidden">İşlem</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="schedule__updated" id="lastUpdated"></p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/admin.js" defer></script>
</body>
</html>
