# Render "Blueprint" dosyası: mülakat randevu sitesini ve veritabanını
# tek seferde bulutta kurar. Kurulum adımları için: mulakat/README.md
services:
  - type: web
    name: otomotiv-mulakat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: mulakat
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: otomotiv-mulakat-db
          property: connectionString
      - key: ADMIN_PASSWORD # yönetim paneli (/admin) şifresi
        sync: false
      - key: INTERVIEW_DATE # mülakat günü (YYYY-AA-GG): 6 Ekim 2026 Salı
        value: "2026-10-06"
      - key: END_TIME # 17:00–19:00 arası 10 dakikalık 12 görüşme
        value: "19:00"
      - key: SLOT_CAPACITY # bir görüşmeye alınabilecek kişi sayısı (12 görüşme × 3 = 36 kişi)
        value: "3"

databases:
  - name: otomotiv-mulakat-db
    plan: free
    region: frankfurt
    databaseName: mulakat
    user: mulakat
    ipAllowList: [] # yalnızca Render içinden erişilebilir
