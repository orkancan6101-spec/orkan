# Render "Blueprint" dosyası: mülakat randevu sitesini bulutta kurar.
# Veritabanı Neon'da (ücretsiz, süresi dolmaz). Kurulum adımları: mulakat/README.md
services:
  - type: web
    name: otomotiv-mulakat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: mulakat
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon'dan kopyalanan bağlantı adresi (postgresql://...)
        sync: false
      - key: ADMIN_PASSWORD # yönetim paneli (/admin) şifresi
        sync: false
      - key: INTERVIEW_DATE # mülakat günü (YYYY-AA-GG): 6 Ekim 2026 Salı
        value: "2026-10-06"
